# Turns every pushed version tag (v1.2.3) into a GitHub Release.
# The release event is what the public #releases channel on Discord listens to.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          # Title: "v1.8.1: <commit subject>". Notes: the commit body without trailers, plus a play link.
          subject=$(git log -1 --format=%s "$TAG" | sed -E 's/ *\(v[0-9][^)]*\)$//')
          git log -1 --format=%b "$TAG" | sed '/^Co-Authored-By:/Id' > notes.md
          printf '\n🎮 Play: https://raugykla.github.io/vaiduoklis/\n' >> notes.md
          gh release create "$TAG" --title "$TAG: $subject" --notes-file notes.md --verify-tag
